id = "junie"
version = "2026.10.26.1"
min_engine_version = 2
updated_at = "2026-10-26T00:00:00Z"

# Junie emits OSC 9;4 progress inside Herdr since JetBrains/junie-agent#8221.
# Screen rules cover older versions and progress overwritten by OSC 9
# notifications. Visible prompts stay blocked under working or idle progress.

[[rules]]
id = "osc_progress_blocked"
state = "blocked"
priority = 1400
region = "osc_progress"
visible_blocker = true
regex = ['^4;4(?:;|$)']

[[rules]]
id = "tool_approval_blocked"
state = "blocked"
priority = 1300
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = ["allow once"]
line_regex = ['^\s*Allow .+\?\s*$']
any = [
  { contains = ["or reject with a reason"] },
  { line_regex = ['^\s*(?:→\s*)?Deny\s*$'] },
]

[[rules]]
id = "project_trust_blocked"
state = "blocked"
priority = 1290
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = ["needs your trust decision"]
any = [
  { contains = ["trust this project"] },
  { contains = ["keep untrusted"] },
]

[[rules]]
id = "model_picker_overlay"
state = "unknown"
priority = 1250
region = "bottom_non_empty_lines(6)"
skip_state_update = true
any = [
  { line_regex = ['\$\d+\.\d+\s+\$\d+\.\d+\s+per Mtok'] },
  { line_regex = ['^\s*tab / shift\+tab to switch tabs\s*$'] },
]

[[rules]]
id = "osc_progress_working"
state = "working"
priority = 1200
region = "osc_progress"
visible_working = true
regex = ['^4;3(?:;|$)']

[[rules]]
id = "osc_progress_idle"
state = "idle"
priority = 1150
region = "osc_progress"
visible_idle = true
regex = ['^4;[02](?:;|$)']

[[rules]]
id = "working_spinner_stop_hint"
state = "working"
priority = 1000
region = "bottom_non_empty_lines(8)"
visible_working = true
contains = ["esc to stop"]
line_regex = ['^\s*[\x{2800}-\x{28FF}]\s+\S']

[[rules]]
id = "status_bar_idle"
state = "idle"
priority = 900
region = "bottom_non_empty_lines(3)"
visible_idle = true
line_regex = ['⚑ Brave (?:off|auto|on)\b']
