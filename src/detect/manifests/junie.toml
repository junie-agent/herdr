id = "junie"
version = "2026.10.05.1"
min_engine_version = 2
updated_at = "2026-10-05T00:00:00Z"

# Junie CLI (JetBrains) draws its chrome at the bottom of the main buffer. The
# idle input box sits above a status bar such as
# "~ work   ⚑ Brave off ctrl + b   ⌘ <model> ...". While a turn runs, a braille
# spinner row with an "esc to stop" hint appears above the input box. Tool
# approvals (brave mode off) replace the input box and status bar with a titled
# "Allow ...?" question followed by "Allow once", "Always allow (...)", "Deny",
# and "Or reject with a reason". The first launch in a directory asks for a
# project trust decision, and the model picker lists per-Mtok prices.
#
# Evidence: Junie 26.9.22 (3419.7), captured with `herdr agent read <pane>
# --source detection --format text`. Junie emits OSC notifications but no
# OSC 9;4 progress, so these screen rules are the only state evidence.

[[rules]]
id = "tool_approval_blocked"
state = "blocked"
priority = 1100
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = ["allow once"]
line_regex = ['^\s*Allow .+\?\s*$']
any = [
  { contains = ["or reject with a reason"] },
  { line_regex = ['^\s*(?:→\s*)?Deny\s*$'] },
]

[[rules]]
id = "project_trust_blocked"
state = "blocked"
priority = 1090
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = ["needs your trust decision"]
any = [
  { contains = ["trust this project"] },
  { contains = ["keep untrusted"] },
]

[[rules]]
id = "model_picker_overlay"
state = "unknown"
priority = 1050
region = "bottom_non_empty_lines(6)"
skip_state_update = true
line_regex = ['\$\d+\.\d+\s+\$\d+\.\d+\s+per Mtok']

[[rules]]
id = "working_spinner_stop_hint"
state = "working"
priority = 1000
region = "bottom_non_empty_lines(8)"
visible_working = true
contains = ["esc to stop"]
line_regex = ['^\s*[\x{2800}-\x{28FF}]\s+\S']

[[rules]]
id = "status_bar_idle"
state = "idle"
priority = 900
region = "bottom_non_empty_lines(3)"
visible_idle = true
line_regex = ['⚑ Brave (?:off|auto|on)\b']
